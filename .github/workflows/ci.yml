name: Integracion Continua

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar proyecto
        run: mvn clean compile

      - name: Ejecutar pruebas unitarias y BDD
        run: mvn test

      - name: Publicar reporte de pruebas
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-pruebas-unitarias
          path: target/surefire-reports/

      - name: Publicar reporte BDD
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-cucumber
          path: target/cucumber-report.html

      - name: Instalar k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69

          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list

          sudo apt-get update
          sudo apt-get install k6

      - name: Ejecutar prueba de performance
        run: |
          mkdir -p performance-results

          k6 run \
            --summary-export=performance-results/resumen-performance.json \
            performance/login-performance.js \
            | tee performance-results/salida-k6.txt

      - name: Publicar reporte de performance
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-performance
          path: performance-results/