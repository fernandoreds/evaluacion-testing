      - name: Generar dashboard de resultados
        if: always()
        run: |
          echo "# Dashboard de Integración Continua" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Resumen de pruebas" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Tipo de prueba | Estado | Evidencia |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Pruebas unitarias | Ejecutadas | reporte-pruebas-unitarias |" >> $GITHUB_STEP_SUMMARY
          echo "| Pruebas BDD con Cucumber | Ejecutadas | reporte-cucumber |" >> $GITHUB_STEP_SUMMARY
          echo "| Pruebas de performance con k6 | Ejecutadas | reporte-performance |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Métricas de performance" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f performance-results/resumen-performance.json ]; then
            P95=$(jq '.metrics.http_req_duration.values["p(95)"]' performance-results/resumen-performance.json)
            AVG=$(jq '.metrics.http_req_duration.values.avg' performance-results/resumen-performance.json)
            FAIL_RATE=$(jq '.metrics.http_req_failed.values.rate * 100' performance-results/resumen-performance.json)

            echo "| Métrica | Resultado |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---:|" >> $GITHUB_STEP_SUMMARY
            echo "| Latencia promedio | ${AVG} ms |" >> $GITHUB_STEP_SUMMARY
            echo "| Latencia p95 | ${P95} ms |" >> $GITHUB_STEP_SUMMARY
            echo "| Tasa de errores HTTP | ${FAIL_RATE} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "No se encontró el reporte de performance." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Criterios automáticos" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Latencia p95 menor a 1000 ms." >> $GITHUB_STEP_SUMMARY
          echo "- Tasa de errores HTTP menor al 5%." >> $GITHUB_STEP_SUMMARY
          echo "- Las pruebas unitarias y BDD deben finalizar correctamente." >> $GITHUB_STEP_SUMMARY